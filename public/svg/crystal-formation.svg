<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" fill="none">
  <defs>
    <linearGradient id="crystal-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BA4B5"/>
      <stop offset="50%" stop-color="#3D8A96"/>
      <stop offset="100%" stop-color="#2D6A6A"/>
    </linearGradient>
    <filter id="crystal-glow-filter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Base stone -->
  <ellipse cx="32" cy="74" rx="16" ry="4" fill="#C4B8A0" opacity="0.5"/>
  <!-- Main crystal -->
  <polygon points="32,8 42,35 38,70 26,70 22,35" fill="url(#crystal-body)" opacity="0.8"/>
  <!-- Crystal facets -->
  <polygon points="32,8 36,30 32,70 28,30" fill="#fff" opacity="0.15"/>
  <polygon points="32,8 42,35 36,30" fill="#8EC5D0" opacity="0.3"/>
  <polygon points="32,8 22,35 28,30" fill="#2D6A6A" opacity="0.2"/>
  <!-- Inner glow -->
  <polygon points="32,15 37,35 32,55 27,35" fill="#4FC3F7" opacity="0.15" filter="url(#crystal-glow-filter)"/>
  <!-- Small crystal shards -->
  <polygon points="18,50 22,40 20,55" fill="#5BA4B5" opacity="0.4"/>
  <polygon points="46,48 44,38 48,52" fill="#5BA4B5" opacity="0.35"/>
  <!-- Sparkles -->
  <circle cx="32" cy="20" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="26" cy="30" r="1" fill="#C9A84C" opacity="0.5"/>
  <circle cx="38" cy="28" r="1" fill="#C9A84C" opacity="0.4"/>
  <circle cx="32" cy="45" r="0.8" fill="#4FC3F7" opacity="0.5"/>
</svg>
