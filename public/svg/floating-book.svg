<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="book-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D6A6A"/>
      <stop offset="100%" stop-color="#1A1510"/>
    </linearGradient>
    <linearGradient id="book-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#EDE7DB"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Book cover back -->
  <path d="M8 14 L32 8 L56 14 L56 52 L32 58 L8 52Z" fill="url(#book-cover)" stroke="#C9A84C" stroke-width="0.5" opacity="0.9"/>
  <!-- Pages -->
  <path d="M12 16 L32 10 L52 16 L52 48 L32 54 L12 48Z" fill="url(#book-page)" opacity="0.95"/>
  <!-- Page lines -->
  <line x1="18" y1="22" x2="46" y2="18" stroke="#C9A84C" stroke-width="0.3" opacity="0.4"/>
  <line x1="18" y1="28" x2="46" y2="24" stroke="#C9A84C" stroke-width="0.3" opacity="0.3"/>
  <line x1="18" y1="34" x2="46" y2="30" stroke="#C9A84C" stroke-width="0.3" opacity="0.3"/>
  <line x1="18" y1="40" x2="46" y2="36" stroke="#C9A84C" stroke-width="0.3" opacity="0.2"/>
  <!-- Rune on page -->
  <circle cx="32" cy="32" r="6" stroke="#5BA4B5" stroke-width="0.5" fill="none" opacity="0.4"/>
  <path d="M32 26 L34 30 L32 28 L30 30Z" fill="#5BA4B5" opacity="0.5"/>
  <!-- Crystal glow -->
  <circle cx="32" cy="32" r="10" fill="#4FC3F7" opacity="0.08" filter="url(#glow)"/>
  <!-- Sparkles -->
  <circle cx="20" cy="18" r="1" fill="#C9A84C" opacity="0.6"/>
  <circle cx="44" cy="16" r="0.8" fill="#C9A84C" opacity="0.4"/>
  <circle cx="32" cy="12" r="0.6" fill="#4FC3F7" opacity="0.5"/>
</svg>