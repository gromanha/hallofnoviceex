<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 48" fill="none">
  <defs>
    <linearGradient id="arch-line" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0"/>
      <stop offset="25%" stop-color="#C9A84C" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#C9A84C" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#C9A84C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arch-crystal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BA4B5"/>
      <stop offset="100%" stop-color="#3D8A96"/>
    </linearGradient>
  </defs>
  <!-- Left line -->
  <line x1="0" y1="24" x2="165" y2="24" stroke="url(#arch-line)" stroke-width="1"/>
  <!-- Right line -->
  <line x1="235" y1="24" x2="400" y2="24" stroke="url(#arch-line)" stroke-width="1"/>
  <!-- Gothic arch center -->
  <path d="M180 24 L180 14 Q190 4 200 2 Q210 4 220 14 L220 24" 
        stroke="#C9A84C" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M185 24 L185 16 Q192 8 200 6 Q208 8 215 16 L215 24" 
        stroke="#5BA4B5" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- Crystal point -->
  <polygon points="200,4 204,12 200,20 196,12" fill="url(#arch-crystal)" opacity="0.6"/>
  <polygon points="200,7 202,12 200,17 198,12" fill="#fff" opacity="0.3"/>
  <!-- Small decorative dots -->
  <circle cx="170" cy="24" r="1.5" fill="#C9A84C" opacity="0.4"/>
  <circle cx="230" cy="24" r="1.5" fill="#C9A84C" opacity="0.4"/>
  <circle cx="155" cy="24" r="1" fill="#9B7EC8" opacity="0.3"/>
  <circle cx="245" cy="24" r="1" fill="#9B7EC8" opacity="0.3"/>
</svg>
