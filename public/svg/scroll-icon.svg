<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="scroll-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5EFE0"/>
      <stop offset="100%" stop-color="#E3D9C5"/>
    </linearGradient>
  </defs>
  <!-- Scroll body -->
  <rect x="12" y="15" width="56" height="50" rx="2" fill="url(#scroll-bg)" stroke="#C4B8A0" stroke-width="1"/>
  <!-- Top roll -->
  <ellipse cx="40" cy="15" rx="30" ry="5" fill="#E3D9C5" stroke="#C4B8A0" stroke-width="0.8"/>
  <ellipse cx="40" cy="15" rx="28" ry="3" fill="#F5EFE0" opacity="0.6"/>
  <!-- Bottom roll -->
  <ellipse cx="40" cy="65" rx="30" ry="5" fill="#E3D9C5" stroke="#C4B8A0" stroke-width="0.8"/>
  <ellipse cx="40" cy="65" rx="28" ry="3" fill="#F5EFE0" opacity="0.6"/>
  <!-- Decorative lines (text placeholder) -->
  <line x1="20" y1="28" x2="60" y2="28" stroke="#C4B8A0" stroke-width="0.5" opacity="0.4"/>
  <line x1="20" y1="34" x2="55" y2="34" stroke="#C4B8A0" stroke-width="0.5" opacity="0.3"/>
  <line x1="20" y1="40" x2="58" y2="40" stroke="#C4B8A0" stroke-width="0.5" opacity="0.3"/>
  <line x1="20" y1="46" x2="50" y2="46" stroke="#C4B8A0" stroke-width="0.5" opacity="0.25"/>
  <line x1="20" y1="52" x2="52" y2="52" stroke="#C4B8A0" stroke-width="0.5" opacity="0.2"/>
  <!-- Seal -->
  <circle cx="40" cy="40" r="8" fill="#C9A84C" opacity="0.15"/>
  <circle cx="40" cy="40" r="6" stroke="#C9A84C" stroke-width="0.5" fill="none" opacity="0.4"/>
  <!-- Crystal accent -->
  <polygon points="40,34 42,38 40,42 38,38" fill="#5BA4B5" opacity="0.5"/>
</svg>
